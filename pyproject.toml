[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whirlpool_sixth_sense"
# Deliberately NOT left at bare "1.3.1": Home Assistant's requirement
# installer treats a manifest pin as satisfied purely by version-string
# comparison, not by content. Adam's HAOS already has the real,
# unpatched PyPI 1.3.1 installed for the stock integration - if this
# fork's own version string were also exactly "1.3.1", the exact pin
# "whirlpool-sixth-sense==1.3.1" already used by HA 2026.8.3's manifest
# would look pre-satisfied and HA would never install THIS patched copy.
# ".post1" makes this fork's version distinguishable and installable via
# its own explicit pin - see the paired HA integration fork's
# manifest.json and CHANGES.md.
version = "1.3.1.post1"
license = "MIT"
authors = [{ name = "Abílio Costa", email = "amfcalt@gmail.com" }]
description = "Unofficial API for Whirlpool's 6th Sense appliances"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.9.1",
    "websockets>=8.1",
    "async-timeout>=4.0.3",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/abmantis/whirlpool-sixth-sense/"



[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
exclude = ["tests"]
namespaces = false

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # isort
    "I",]


[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.pyright]
typeCheckingMode = "standard"

[tool.semantic_release]
branch = "master"
version_toml = ["pyproject.toml:project.version"]
build_command = "pip install build && python -m build"
tag_format = "{version}"

[tool.semantic_release.publish]
upload_to_vcs_release = false
